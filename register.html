<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - CodeMaster</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
        .auth-orb.orb-a { width: 480px; height: 480px; background: rgba(123,44,191,0.16); top: -120px; left: -120px; animation: orbFloat 16s ease-in-out infinite; }
        .auth-orb.orb-b { width: 420px; height: 420px; background: rgba(0,212,255,0.18); bottom: -140px; right: -100px; animation: orbFloat 20s ease-in-out infinite reverse; }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(40px,-30px) scale(1.08); }
        }

        .auth-page .auth-card {
            position: relative; z-index: 1;
            width: 100%; max-width: 460px;
            padding: 44px 40px;
            background: linear-gradient(145deg, rgba(26,35,56,0.92) 0%, rgba(20,27,45,0.92) 100%);
            border: 1px solid rgba(0,212,255,0.25);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 70px rgba(0,0,0,0.5), 0 0 40px rgba(0,212,255,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .auth-page .auth-card::before {
            content: ''; position: absolute; top: 0; left: 24px; right: 24px;
            height: 3px; background: linear-gradient(90deg, transparent, #00d4ff, #7b2cbf, transparent);
            border-radius: 3px;
            animation: topLine 3s ease-in-out infinite;
        }
        @keyframes topLine {
            0%,100% { opacity: 0.6; }
            50% { opacity: 1; box-shadow: 0 0 20px rgba(0,212,255,0.8); }
        }
        .auth-page .auth-header .logo {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin-bottom: 20px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .auth-page .auth-header .logo:hover { transform: scale(1.05); }
        .auth-page .auth-header .logo .logo-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px; font-weight: 800; color: #fff;
            box-shadow: 0 6px 20px rgba(0,212,255,0.4);
            position: relative; overflow: hidden; letter-spacing: -0.5px;
        }
        .auth-page .auth-header .logo .logo-icon::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
            transform: translateX(-100%);
            animation: shine 3.5s infinite;
        }
        @keyframes shine {
            0%, 60% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .auth-page .auth-header .logo span {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #64d2ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: 0.5px;
        }
        .auth-page .auth-header h2 { font-size: 28px; margin-bottom: 8px; color: #fff; }
        .auth-page .auth-header p { color: #a0aec0; font-size: 14px; }

        .auth-page .form-group { margin-bottom: 20px; }
        .auth-page .form-group input {
            width: 100%; padding: 14px 16px;
            background: rgba(10,14,26,0.8);
            border: 1.5px solid #2a3447; border-radius: 12px;
            color: #fff; font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .auth-page .form-group input:hover { border-color: rgba(0,212,255,0.4); }
        .auth-page .form-group input:focus {
            border-color: #00d4ff; background: rgba(10,14,26,0.95);
            box-shadow: 0 0 0 4px rgba(0,212,255,0.12), 0 0 24px rgba(0,212,255,0.2);
            transform: translateY(-1px);
        }
        .auth-page .form-group label {
            display: block; margin-bottom: 8px;
            font-size: 13px; font-weight: 600; color: #a0aec0;
            letter-spacing: 0.3px; transition: color 0.3s;
        }
        .auth-page .form-group:focus-within label { color: #64d2ff; }

        .auth-page .password-field { position: relative; }
        .auth-page .password-field input { padding-right: 48px; }
        .auth-page .password-toggle {
            position: absolute; top: 50%; right: 12px;
            width: 30px; height: 30px; padding: 0;
            transform: translateY(-50%);
            border: 0; background: transparent;
            color: #718096; font-size: 17px;
            cursor: pointer; transition: all 0.3s;
            border-radius: 8px;
        }
        .auth-page .password-toggle:hover {
            color: #64d2ff; background: rgba(0,212,255,0.1);
        }

        .auth-page .form-error {
            min-height: 18px; margin-top: 6px;
            color: #ff4757; font-size: 12px;
        }
        .auth-page .form-group input.input-error {
            border-color: #ff4757;
            box-shadow: 0 0 0 4px rgba(255,71,87,0.1);
        }

        .auth-page .form-row {
            display: flex; justify-content: flex-start;
            align-items: center; margin-bottom: 24px; font-size: 13px;
        }
        .auth-page .remember-me {
            display: flex; align-items: center; gap: 8px;
            color: #a0aec0; cursor: pointer;
        }
        .auth-page .remember-me input { accent-color: #00d4ff; }

        .auth-page .auth-btn {
            width: 100%; padding: 15px;
            font-size: 15px; font-weight: 700; border-radius: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: #fff;
            box-shadow: 0 8px 24px rgba(0,212,255,0.35);
            position: relative; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        .auth-page .auth-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%); transition: transform 0.6s;
        }
        .auth-page .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,212,255,0.55); }
        .auth-page .auth-btn:hover::after { transform: translateX(100%); }

        .auth-page .auth-footer { text-align: center; font-size: 14px; color: #a0aec0; }
        .auth-page .auth-footer a {
            color: #64d2ff; font-weight: 600; transition: all 0.3s;
        }
        .auth-page .auth-footer a:hover { color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.6); }
    </style>
</head>
<body class="auth-page">

<div id="starField"></div>
<div class="auth-orb orb-a"></div>
<div class="auth-orb orb-b"></div>

<div class="auth-card card">
    <div class="auth-header">
        <a href="index.html" class="logo">
            <div class="logo-icon">Cm</div>
            <span>CodeMaster</span>
        </a>
        <h2>创建账号</h2>
        <p>开启你的C语言编程学习之旅</p>
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label for="regUsername">用户名</label>
            <input type="text" id="regUsername" placeholder="请输入用户名" required>
        </div>

        <div class="form-group">
            <label for="regEmail">邮箱</label>
            <input type="email" id="regEmail" placeholder="请输入邮箱地址" required>
        </div>

        <div class="form-group">
            <label for="regPassword">设置密码</label>
            <div class="password-field">
                <input type="password" id="regPassword" placeholder="请设置6-20位密码" minlength="6" maxlength="20" autocomplete="new-password" required>
                <button type="button" class="password-toggle" data-password-target="regPassword" aria-label="显示密码" title="显示密码">&#128065;</button>
            </div>
            <p id="passwordHint" class="form-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <div class="password-field">
                <input type="password" id="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password" required>
                <button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="显示密码" title="显示密码">&#128065;</button>
            </div>
        </div>

        <div class="form-row">
            <label class="remember-me">
                <input type="checkbox" required> 我已阅读并同意用户协议
            </label>
        </div>

        <button type="submit" class="btn btn-primary auth-btn">注 册</button>
    </form>

    <div class="auth-footer">
        已有账号？<a href="login.html">立即登录</a>
    </div>

    <div class="auth-footer" style="margin-top: 8px; font-size: 12px;">
        ©2026 CodeMaster 北京理工大学
    </div>
</div>

<script src="assets/js/main.js"></script>
<script>
    (function(){
        const field = document.getElementById('starField');
        if (!field) return;
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('span');
            const size = Math.random() * 2 + 1;
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.animationDelay = (Math.random() * 3) + 's';
            s.style.animationDuration = (2 + Math.random() * 3) + 's';
            s.style.opacity = Math.random() * 0.5 + 0.1;
            field.appendChild(s);
        }
    })();
</script>
</body>
</html>
