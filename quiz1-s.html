<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专题1 - 简单试卷</title>
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei",sans-serif;
}
body{
    padding:0;
    background:
        radial-gradient(circle at 10% 10%, rgba(100,210,255,0.08), transparent 25%),
        radial-gradient(circle at 90% 18%, rgba(120,80,255,0.06), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(100,210,255,0.06), transparent 28%),
        linear-gradient(180deg, #0a0f1f 0%, #0d1430 45%, #0a0f1f 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

#quiz-page{
    display:block;
    max-width:720px;
    margin:100px auto 40px auto;
    padding:32px;
    background:linear-gradient(135deg, rgba(15,25,55,0.98), rgba(10,18,45,0.98));
    border:1px solid rgba(100,210,255,0.55);
    border-radius:24px;
    box-shadow:
        0 0 35px rgba(0,0,0,0.45),
        0 0 18px rgba(100,210,255,0.18),
        inset 0 0 22px rgba(100,210,255,0.06);
}

.quiz-header{
    margin-bottom:24px;
}

.quiz-title{
    font-size:22px;
    margin-bottom:12px;
    color:#dfefff;
    letter-spacing:1px;
    text-shadow:0 0 10px rgba(100,210,255,0.55);
}

#q-index{
    color:#91a4d8;
    font-size:15px;
}

/* 充能进度条 */
.progress-wrap{
    width:100%;
    height:16px;
    background:linear-gradient(90deg, rgba(20,30,60,0.9), rgba(15,25,50,0.9));
    border:1px solid rgba(100,210,255,0.35);
    border-radius:99px;
    overflow:hidden;
    box-shadow:inset 0 0 10px rgba(0,0,0,0.5);
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #36a2eb, #64d2ff, #4cd964);
    transition:0.35s ease;
    box-shadow:0 0 14px rgba(100,210,255,0.75);
}

.question-block{
    margin:28px 0;
}

.question-text{
    font-size:20px;
    margin-bottom:22px;
    color:#eaf6ff;
    line-height:1.6;
}

.option-item{
    padding:14px 18px;
    border:1px solid rgba(100,210,255,0.35);
    border-radius:16px;
    margin-bottom:14px;
    cursor:pointer;
    transition:0.22s;
    background:rgba(20,35,70,0.85);
    color:#cde8ff;
}

.option-item:hover{
    border-color:rgba(100,210,255,0.75);
    background:rgba(30,50,100,0.9);
    box-shadow:0 0 12px rgba(100,210,255,0.35);
}

.option-item.selected{
    background:rgba(50,80,140,0.95);
    border-color:#64d2ff;
    box-shadow:0 0 15px rgba(100,210,255,0.55);
}

.option-item.readonly{
    cursor:default;
}

.option-item.readonly:hover{
    border-color:rgba(100,210,255,0.35);
    background:rgba(20,35,70,0.85);
    box-shadow:none;
}

/* 只读模式颜色标记 */
.option-item.correct-ans{
    background:rgba(39,174,96,0.22);
    border-color:#27ae60;
    color:#69ff9a;
    box-shadow:0 0 12px rgba(39,174,96,0.35);
}

.option-item.wrong-choose{
    background:rgba(229,57,53,0.22);
    border-color:#e53935;
    color:#ff6b6b;
    box-shadow:0 0 12px rgba(229,57,53,0.35);
}

.btn-group{
    display:flex;
    gap:12px;
    margin-top:32px;
    flex-wrap:wrap;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.5px;
}

#prev-btn{
    background:linear-gradient(135deg, #607d8b, #455a64);
    color:#fff;
    box-shadow:0 0 12px rgba(96,125,139,0.35);
}

#next-btn{
    background:linear-gradient(135deg, #36a2eb, #64d2ff);
    color:#08111f;
    box-shadow:0 0 12px rgba(100,210,255,0.55);
}

#submit-btn{
    background:linear-gradient(135deg, #27ae60, #4cd964);
    color:#0f2f1a;
    box-shadow:0 0 12px rgba(39,174,96,0.55);
}

#back-home{
    background:linear-gradient(135deg, #455a64, #37474f);
    color:#fff;
    box-shadow:0 0 12px rgba(69,90,100,0.35);
}

#showResultBtn{
    background:linear-gradient(135deg, #9b59b6, #c39bd3);
    color:#fff;
    box-shadow:0 0 12px rgba(155,89,182,0.55);
}

.tip-readonly{
    color:#ff6b6b;
    margin-bottom:18px;
    font-weight:bold;
    text-shadow:0 0 8px rgba(229,57,53,0.45);
}

/* 结果弹窗 */
.result-modal{
    position:fixed;
    top: 20px;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(0,0,0,0.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.result-content{
    background:linear-gradient(135deg, rgba(15,25,55,0.98), rgba(10,18,45,0.98));
    border:1px solid rgba(100,210,255,0.55);
    width:640px;
    padding:32px;
    border-radius:24px;
    max-height:85vh;
    overflow:auto;
    box-shadow:
        0 0 35px rgba(0,0,0,0.45),
        0 0 18px rgba(100,210,255,0.18);
    color:#eaf6ff;
}

.result-content h2{
    color:#64d2ff;
    text-shadow:0 0 10px rgba(100,210,255,0.55);
}

.result-item{
    padding:14px 0;
    border-bottom:1px solid rgba(100,210,255,0.18);
}

.result-item .q-title{
    font-weight:bold;
    margin-bottom:8px;
    color:#dfefff;
}

.correct{
    color:#69ff9a;
}

.wrong{
    color:#ff6b6b;
}

#score-text{
    font-size:18px;
    color:#64d2ff;
    margin:16px 0;
}
</style>
</head>
<body>

        <div class="nav-container">

                <div class="logo-icon">{ }</div>

            <ul class="nav-links">

                <a href="login.html" id="loginBtn" class="btn btn-ghost">登录</a>
                <a href="register.html" id="registerBtn" class="btn btn-outline">注册</a>

            </div>

<!-- 答题页面 -->
<div id="quiz-page">
    <div class="quiz-header">
        <div class="quiz-title" id="quiz-title">专题1 - 简单试卷</div>
        <div id="readonlyTip" class="tip-readonly" style="display:none;">⚠️本试卷已完成，仅可查看，不能修改答案</div>
        <div id="q-index">第1题 / 共5题</div>
        <div class="progress-wrap" style="margin-top:10px;">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>
    <div class="question-block">
        <div class="question-text" id="q-text"></div>
        <div id="option-container"></div>
    </div>
    <div class="btn-group">
        <button id="prev-btn">上一题</button>
        <button id="next-btn">下一题</button>
        <button id="submit-btn">提交试卷</button>
        <button id="showResultBtn" style="display:none;">查看成绩</button>
        <button id="back-home">返回专题</button>
    </div>
</div>
</section>

<!-- 成绩弹窗 -->
<div class="result-modal" id="resultModal">
    <div class="result-content">
        <h2>测试结果</h2>
        <p id="score-text"></p>
        <div id="result-detail"></div>
        <button onclick="closeModal()" style="margin-top:15px;">关闭</button>
    </div>
</div>

    <footer class="footer">
        <div class="container">

        </div>
    </footer>

<script src="assets/js/quiz.js"></script>
<script>

const questions = [
    {q:"HTML段落标签是？",opts:["<p>","<div>","<span>","<b>"],ans:0},
    {q:"CSS哪个设置背景色？",opts:["color","background-color","font-size","border"],ans:1},
    {q:"JS弹出提示框?",opts:["alert()","console.log","confirm","prompt"],ans:0},
    {q:"哪个是id选择器?",opts:[".class","#id","div","*"],ans:1},
    {q:"border-radius作用？",opts:["阴影","圆角","边框颜色","字体"],ans:1},
];
// 参数：initQuiz(专题编号,难度编号,题目数组)
// 专题从0开始，难度0=简单,1=中等,2=困难
initQuiz(0,0,questions);
</script>
