*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    padding:0;
    min-height:100vh;
    /* 让页面纵向排列：导航 + 主体内容 + footer */
    display:flex;
    flex-direction:column;
}

#home-page{
    display:block;
    /* 占满剩余高度，用来垂直居中专题列表 */
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    /* =========删除原来的absolute定位！========= */
    /* position: absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%); */
}

.item{
    position:relative;
    width:280px;
    height:52px;
    background:linear-gradient(135deg, rgba(30,40,70,0.95), rgba(20,30,60,0.95));
    border:1px solid rgba(100,210,255,0.6);
    border-radius:26px;
    box-shadow:
        0 0 12px rgba(0,0,0,0.35),
        inset 0 0 18px rgba(100,210,255,0.08);
    cursor:pointer;
    transition: all 0.32s ease;
    display:flex;
    align-items:center;
    padding:0 24px;
    overflow:visible;
}

.item:hover{
    width:420px;
    border-color:rgba(100,210,255,0.9);
    background:linear-gradient(135deg, rgba(45,60,100,0.98), rgba(30,45,90,0.98));
    box-shadow:
        0 0 18px rgba(100,210,255,0.55),
        inset 0 0 22px rgba(100,210,255,0.12);
}

.item.active{
    width:420px;
    border-color:#64d2ff;
    background:linear-gradient(135deg, rgba(50,70,120,1), rgba(35,55,110,1));
    box-shadow:
        0 0 22px rgba(100,210,255,0.7),
        inset 0 0 24px rgba(100,210,255,0.18);
}

.item-text{
    font-size:16px;
    color:#eaf6ff;
    white-space:nowrap;
    letter-spacing:0.5px;
    text-shadow:0 0 8px rgba(100,210,255,0.45);
}

.dot-box{
    position:absolute;
    right:18px;
    display:flex;
    gap:14px;
    opacity:0;
    visibility:hidden;
    transition:0.25s ease;
}

.item:hover .dot-box,
.item.active .dot-box{
    opacity:1;
    visibility:visible;
}

.dot-box a{
    display:flex;
    width:36px;
    height:36px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #7be4ff, #36a2eb);
    color:#08111f;
    text-decoration:none;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:600;
    transition:0.2s;
    box-shadow:
        0 0 12px rgba(100,210,255,0.65),
        inset 0 0 10px rgba(255,255,255,0.35);
}

.dot-box a.done{
    background:radial-gradient(circle at 35% 35%, #69ff9a, #27ae60);
    color:#0f2f1a;
    box-shadow:
        0 0 12px rgba(39,174,96,0.65),
        inset 0 0 10px rgba(255,255,255,0.35);
}

.dot-box a:hover{
    transform:scale(1.15);
    box-shadow:
        0 0 16px rgba(100,210,255,0.9),
        inset 0 0 12px rgba(255,255,255,0.45);
}
    </style>

    <script>
const items = document.querySelectorAll('.item');
items.forEach(el=>{
    el.addEventListener('click',function(e){
        if(e.target.tagName === 'A') return;
        items.forEach(i=>i.classList.remove('active'));
        this.classList.add('active');
    })
})

</script>
