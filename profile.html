<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - Code master</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">CM</div>
                <span>Code master</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="list.html">课程中心</a></li>
                <li><a href="quiz.html">在线小测</a></li>
                <li><a href="game.html">编程游戏</a></li>
                <li><a href="profile.html" class="active">个人中心</a></li>
                <li><a href="team.html">制作团队</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn btn-ghost" id="logoutBtn">退出登录</button>
                <div class="user-avatar" id="userAvatar" onclick="location.href='profile.html'">U</div>
            </div>
        </div>
    </nav>

    <section class="profile-page">
        <div class="container">
            <div class="profile-header card">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div class="profile-info">
                    <h2 id="profileUsername">用户名</h2>
                    <p class="bio" id="profileLevel">Lv.1</p>
                    <p class="bio" id="profileExp">经验: 0 / 200</p>
                    <div class="profile-stats">
                        <div class="profile-stat">
                            <div class="num">3</div>
                            <div class="label">学习课程</div>
                        </div>
                        <div class="profile-stat">
                            <div class="num">12</div>
                            <div class="label">完成课时</div>
                        </div>
                        <div class="profile-stat">
                            <div class="num" id="profileAchievementCount">0</div>
                            <div class="label">获得成就</div>
                        </div>
                        <div class="profile-stat">
                            <div class="num">85%</div>
                            <div class="label">正确率</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="profile-sections">
                <div class="profile-section">
                    <div class="learning-heading">
                        <div>
                            <h3>📚 全部课程</h3>
                            <p class="learning-summary" id="courseProgressSummary">已完成 0/9 门课程 · 0%</p>
                        </div>
                        <div class="course-overall-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" id="courseOverallProgress" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <div id="learningList" class="learning-list-scroll">
                    </div>
                    <div id="courseBranchList" class="course-branch-list"></div>
                </div>

                <div>
                    <div class="profile-section card" style="margin-bottom: 24px;">
                        <h3>🏆 最新成就</h3>
                        <div id="achievementList" class="profile-achievement-grid"></div>
                    </div>

                    <div class="profile-section card">
                        <h3>📊 学习数据</h3>
                        <div style="color: var(--text-secondary); font-size: 14px; line-height: 2.2;">
                            <div style="display: flex; justify-content: space-between;">
                                <span>累计在线时长</span>
                                <span id="onlineTime" style="color: var(--primary); font-weight: 600;">0 分钟</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <section class="profile-section card favorites-section" aria-labelledby="favoritesTitle">
                <div class="favorites-header">
                    <div>
                        <h3 id="favoritesTitle">⭐ 我的收藏夹</h3>
                        <p class="favorites-description">收藏的在线小测和学习内容会显示在这里</p>
                    </div>
                    <span class="favorites-count">0 项</span>
                </div>
                <div class="favorites-empty" id="favoritesList">
                    <div class="favorites-empty-icon">☆</div>
                    <p>暂时还没有收藏内容</p>
                </div>
            </section>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 CodeMaster. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
